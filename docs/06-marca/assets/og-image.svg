<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     role="img" aria-labelledby="og-titulo" aria-describedby="og-desc">
  <title id="og-titulo">Campus — app de eventos universitários</title>
  <desc id="og-desc">Cartão de compartilhamento: logo Campus, chamada sobre alcance por
    turma, curso e faculdade, e o cartão-ingresso picotado como elemento de assinatura.</desc>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="#FBFBFA" />

  <!-- Faixa coral de assinatura na borda superior -->
  <rect width="1200" height="8" fill="#C83A16" />

  <!-- Malha discreta de 4px para dar textura sem ruído -->
  <defs>
    <pattern id="grade" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7E5E0" stroke-width="1" />
    </pattern>
    <clipPath id="cortePicotado">
      <path d="
        M 700 132 H 1092 A 20 20 0 0 1 1112 152 V 330
        A 22 22 0 0 0 1112 374 V 498 A 20 20 0 0 1 1092 518
        H 700 A 20 20 0 0 1 680 498 V 374
        A 22 22 0 0 0 680 330 V 152 A 20 20 0 0 1 700 132 Z" />
    </clipPath>
  </defs>
  <rect x="0" y="8" width="1200" height="622" fill="url(#grade)" opacity="0.55" />

  <!-- ==================== Coluna esquerda: marca e mensagem ==================== -->

  <!-- Lockup do logo -->
  <g transform="translate(88 76)">
    <g transform="translate(0 2) scale(1.6)">
      <path fill="#C83A16" fill-rule="evenodd" d="
        M 5.5 4 H 18.5 A 3.5 3.5 0 0 1 22 7.5 V 9.8
        A 2.2 2.2 0 0 0 22 14.2 V 16.5 A 3.5 3.5 0 0 1 18.5 20
        H 5.5 A 3.5 3.5 0 0 1 2 16.5 V 14.2
        A 2.2 2.2 0 0 0 2 9.8 V 7.5 A 3.5 3.5 0 0 1 5.5 4 Z
        M 15.21 15.83 A 5 5 0 1 1 15.21 8.17 L 13.54 10.16
        A 2.4 2.4 0 1 0 13.54 13.84 Z" />
    </g>
    <text x="48" y="32" fill="#14181C"
          font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif"
          font-size="34" font-weight="700" letter-spacing="-0.8">Campus</text>
  </g>

  <!-- Eyebrow -->
  <text x="88" y="186" fill="#C83A16"
        font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace"
        font-size="17" letter-spacing="2.4">APP DE EVENTOS UNIVERSITÁRIOS</text>

  <!-- Headline -->
  <text fill="#14181C" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="58" font-weight="700" letter-spacing="-1.6">
    <tspan x="88" y="266">Da sua turma.</tspan>
    <tspan x="88" y="330">Do seu curso.</tspan>
    <tspan x="88" y="394">Da sua faculdade.</tspan>
  </text>

  <!-- Subtítulo -->
  <text fill="#5C6269" font-family="Inter,'Segoe UI',system-ui,sans-serif"
        font-size="21" font-weight="400">
    <tspan x="88" y="450">Alcance segmentado, vagas com fila de espera,</tspan>
    <tspan x="88" y="482">pagamento e check-in por QR Code — em um só lugar.</tspan>
  </text>

  <!-- Chips de alcance -->
  <g font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace" font-size="15">
    <rect x="88" y="518" width="132" height="34" rx="17" fill="#F7E6E1" />
    <text x="154" y="540" fill="#9B2E13" text-anchor="middle">minha turma</text>

    <rect x="232" y="518" width="126" height="34" rx="17" fill="#DEEFED" />
    <text x="295" y="540" fill="#0C6258" text-anchor="middle">meu curso</text>

    <rect x="370" y="518" width="122" height="34" rx="17" fill="#E7E5E0" />
    <text x="431" y="540" fill="#43484E" text-anchor="middle">faculdade</text>
  </g>

  <!-- ==================== Coluna direita: cartão-ingresso ==================== -->

  <!-- Sombra suave desenhada, sem filtro -->
  <path fill="#E7E5E0" opacity="0.75" d="
    M 706 142 H 1098 A 20 20 0 0 1 1118 162 V 340
    A 22 22 0 0 0 1118 384 V 508 A 20 20 0 0 1 1098 528
    H 706 A 20 20 0 0 1 686 508 V 384
    A 22 22 0 0 0 686 340 V 162 A 20 20 0 0 1 706 142 Z" />

  <!-- Corpo do ingresso, com os recortes circulares laterais -->
  <path fill="#FFFFFF" stroke="#E7E5E0" stroke-width="2" d="
    M 700 132 H 1092 A 20 20 0 0 1 1112 152 V 330
    A 22 22 0 0 0 1112 374 V 498 A 20 20 0 0 1 1092 518
    H 700 A 20 20 0 0 1 680 498 V 374
    A 22 22 0 0 0 680 330 V 152 A 20 20 0 0 1 700 132 Z" />

  <!-- Etiqueta de alcance -->
  <rect x="712" y="164" width="126" height="30" rx="15" fill="#C83A16" />
  <text x="775" y="184" fill="#FFFFFF" text-anchor="middle"
        font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace"
        font-size="13" letter-spacing="0.8">MINHA TURMA</text>

  <!-- Título do evento -->
  <text fill="#14181C" font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.6">
    <tspan x="712" y="238">Churrasco de</tspan>
    <tspan x="712" y="274">encerramento</tspan>
  </text>

  <!-- Metadados -->
  <text fill="#5C6269" font-family="Inter,'Segoe UI',system-ui,sans-serif" font-size="17">
    <tspan x="712" y="308">Sáb, 12 set · 13h</tspan>
  </text>

  <!-- Divisória picotada, alinhada com os recortes -->
  <line x1="704" y1="352" x2="1088" y2="352" stroke="#D6D3CC" stroke-width="2"
        stroke-dasharray="8 8" />

  <!-- Barra de vagas -->
  <text x="712" y="396" fill="#5C6269"
        font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace"
        font-size="14">18/40 vagas</text>
  <text x="1080" y="396" fill="#5C6269" text-anchor="end"
        font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace"
        font-size="14">R$ 25,00</text>
  <rect x="712" y="408" width="368" height="10" rx="5" fill="#E7E5E0" />
  <rect x="712" y="408" width="166" height="10" rx="5" fill="#C83A16" />

  <!-- QR Code estilizado (blocos sólidos, sem imagem externa) -->
  <g fill="#14181C">
    <rect x="712" y="440" width="12" height="12" /><rect x="730" y="440" width="12" height="12" />
    <rect x="748" y="440" width="12" height="12" /><rect x="784" y="440" width="12" height="12" />
    <rect x="820" y="440" width="12" height="12" /><rect x="838" y="440" width="12" height="12" />
    <rect x="712" y="458" width="12" height="12" /><rect x="748" y="458" width="12" height="12" />
    <rect x="802" y="458" width="12" height="12" /><rect x="838" y="458" width="12" height="12" />
    <rect x="712" y="476" width="12" height="12" /><rect x="730" y="476" width="12" height="12" />
    <rect x="748" y="476" width="12" height="12" /><rect x="766" y="476" width="12" height="12" />
    <rect x="820" y="476" width="12" height="12" />
    <rect x="766" y="440" width="12" height="12" /><rect x="784" y="476" width="12" height="12" />
    <rect x="802" y="440" width="12" height="12" /><rect x="820" y="458" width="12" height="12" />
  </g>
  <text x="1080" y="482" fill="#14181C" text-anchor="end"
        font-family="'Space Grotesk','Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="17" font-weight="700">CHECK-IN</text>
  <text x="1080" y="504" fill="#5C6269" text-anchor="end"
        font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace"
        font-size="13">CMP-3ESPX-0184</text>

  <!-- Rodapé -->
  <text x="88" y="592" fill="#767D85" font-family="Inter,'Segoe UI',system-ui,sans-serif"
        font-size="15">FIAP · Engenharia de Computação · Engenharia de Software · CP4</text>
  <text x="1112" y="592" fill="#767D85" text-anchor="end"
        font-family="'JetBrains Mono','Cascadia Mono',Consolas,'Courier New',monospace"
        font-size="15">github.com/lukiin-z/campus</text>
</svg>
