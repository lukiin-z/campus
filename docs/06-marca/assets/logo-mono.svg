<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 40" width="152" height="40"
     role="img" aria-labelledby="campus-logo-mono-titulo">
  <title id="campus-logo-mono-titulo">Campus — versão monocromática</title>
