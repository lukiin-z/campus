name: CI

# Roda em todo push e em todo pull request. É o que define "verde" para a
# Definition of Done do time (CONTRIBUTING.md, seção 5).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Um PR que recebe push novo cancela a execução anterior: fila de CI parada é
# fila que ninguém olha.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# O repositório virou monorepo com npm workspaces no CP6: um `package-lock.json`
# na raiz, e `npm ci` instala os três pacotes de uma vez. Os comandos rodam com
# `-w <workspace>` em vez de `working-directory`, porque a cadeia de ferramentas
# (vite, vitest, typescript, eslint, prettier) está içada para a raiz — duas
# cópias de `vite` no monorepo produzem erro de tipo nominal entre elas, e
# `jsdom` só em `app/node_modules` faz o `vitest` da raiz não achá-lo.
jobs:
  documentacao:
    name: Documentação
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Sem dependências: o validador usa só a stdlib do Node, de propósito —
      # documentação não deve depender de npm install para ser verificada.
      - name: Valida links, blocos Mermaid e SVGs
        run: node scripts/validate-docs.mjs

      # Verifica que o contrato compartilhado continua sendo contrato: nenhum
      # arquivo de `packages/shared` importando React, Prisma, NestJS ou o mock,
      # e o alias do Vite igual ao `paths` do TypeScript.
      - name: Fronteira do pacote compartilhado
        run: node scripts/check-contrato.mjs

  compartilhado:
    name: Pacote compartilhado (tipos, regras, schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instala dependências
        run: npm ci

      # Primeiro porque é o mais rápido e o mais fundamental: se as regras de
      # negócio estão erradas, nada depois importa. Roda em `node`, sem jsdom —
      # ~1s contra ~9s da mesma suíte no ambiente do navegador.
      - name: Testes do domínio com cobertura (RNF-015)
        run: npm run test:coverage -w @campus/shared

      - name: Compila o pacote
        run: npm run build -w @campus/shared

  aplicacao:
    name: Aplicação (lint, teste, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # Antes do `npm ci` de propósito: só precisa da stdlib do Node, então é a
      # verificação mais rápida possível do job. Manifest quebrado ou ícone
      # ausente não aparece em lint, teste nem build — só no navegador de quem
      # tenta instalar o app, quando já é tarde.
      #
      # O verificador é inline, e não um arquivo em scripts/, porque cabe em uma
      # tela e não tem outro chamador.
      - name: Manifest do PWA (JSON válido e ícones existentes)
        working-directory: app
        run: |
          node -e "
          const fs=require('node:fs'), p=require('node:path');
          const dir='public';
          const m=JSON.parse(fs.readFileSync(p.join(dir,'manifest.webmanifest'),'utf8'));
          const falhas=[];
          for (const chave of ['name','short_name','description','start_url','scope','display','theme_color','background_color','icons','lang'])
            if (m[chave]===undefined) falhas.push('campo ausente: '+chave);
          const tamanhos=new Set(), finalidades=new Set();
          for (const icone of m.icons ?? []) {
            const alvo=p.join(dir, icone.src.replace(/^\.\//,''));
            if (!fs.existsSync(alvo)) falhas.push('ícone inexistente: '+icone.src+' -> '+alvo);
            for (const t of String(icone.sizes ?? '').split(/\s+/)) tamanhos.add(t);
            for (const f of String(icone.purpose ?? 'any').split(/\s+/)) finalidades.add(f);
          }
          for (const t of ['192x192','512x512']) if (!tamanhos.has(t)) falhas.push('nenhum ícone declarado em '+t);
          if (!finalidades.has('maskable')) falhas.push('nenhum ícone com purpose maskable');
          if (!fs.readFileSync('index.html','utf8').includes('rel=\"manifest\"')) falhas.push('index.html não referencia o manifest');
          if (falhas.length) { console.error('manifest inválido:\n  '+falhas.join('\n  ')); process.exit(1); }
          console.log('manifest ok: '+m.icons.length+' ícones, todos presentes; tamanhos '+[...tamanhos].join(', ')+'; purposes '+[...finalidades].join(', '));
          "

      - name: Instala dependências
        run: npm ci

      # A ordem não é acidental: lint falha em segundos, teste em dezenas,
      # build em minutos. Falhar cedo devolve o resultado mais rápido a quem
      # abriu o PR.
      - name: Lint (ESLint, zero aviso tolerado)
        run: npm run lint -w campus-app

      # Classe utilitária fora da escala fechada do projeto não gera CSS e não
      # dá erro: o elemento colapsa em silêncio. Este passo nasceu de um defeito
      # real (cartão de evento invisível), então ele fica antes dos testes.
      - name: Escala de espaçamento do Tailwind
        run: node scripts/check-tailwind-scale.mjs

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Testes com cobertura (limites em app/vite.config.ts — RNF-015)
        run: npm run test:coverage -w campus-app

      - name: Build de produção
        run: npm run build -w campus-app

      - name: Orçamento de tamanho do pacote (RNF-007)
        run: node scripts/check-bundle-size.mjs

      - name: Guarda o build
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: app/dist
          retention-days: 7

  api:
    name: API (lint, teste, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instala dependências
        run: npm ci

      # A API consome `@campus/shared` pelo `dist`, e o `dist` não é versionado.
      # Sem este passo, `nest build` falha com "Cannot find module
      # '@campus/shared'" — que não menciona build nenhum.
      - name: Compila o pacote compartilhado
        run: npm run build -w @campus/shared

      # O cliente do Prisma é gerado a partir do schema e não é versionado. O
      # `postinstall` que faria isso é bloqueado pelo npm 11 (`allow-scripts`),
      # então a geração é explícita — e é melhor assim: aparece no log.
      - name: Gera o cliente do Prisma
        run: npm run prisma:generate -w campus-api

      # Valida o schema contra o dialeto do PostgreSQL sem precisar de banco.
      #
      # `DATABASE_URL` é obrigatória mesmo assim: o `datasource` a lê com
      # `env(...)` e, sem ela, o `prisma validate` para em `P1012` antes de olhar
      # o schema. Nada é conectado — o valor é placeholder e não é segredo.
      - name: Valida o schema do Prisma
        run: npx prisma validate --schema api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Lint
        run: npm run lint -w campus-api

      - name: Testes unitários
        run: npm run test -w campus-api

      - name: Build
        run: npm run build -w campus-api

      # Compara os caminhos que a aplicação registra com os que o openapi.yaml
      # declara. Depende do build acima porque lê `api/dist`.
      #
      # As variáveis são placeholders: a validação de ambiente derruba o processo
      # sem elas (e é isso que se quer em produção), mas a pergunta aqui é sobre
      # roteamento e o Prisma é substituído por um objeto inerte. Nenhum banco é
      # necessário, e nenhum destes valores é segredo.
      - name: Contrato e rotas servidas concordam
        run: npm run check:rotas
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          JWT_SECRET: placeholder-de-ci-com-32-caracteres
          WEBHOOK_SECRET: placeholder-de-ci-16

  integracao:
    name: API (integração contra PostgreSQL)
    runs-on: ubuntu-latest

    # O que este job existe para responder: as garantias que moram no BANCO
    # funcionam? `SELECT ... FOR UPDATE`, os 20 `CHECK`, os índices únicos
    # parciais e a tradução deles em código de negócio. Nenhuma delas é
    # verificável sem PostgreSQL, e até o CP6 nenhum job tinha um.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus_dev_local
          POSTGRES_DB: campus_teste
        ports: ['5433:5432']
        # Sem o healthcheck o job começa antes de o banco aceitar conexão, e a
        # falha aparece como timeout no primeiro teste em vez de no serviço.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instala dependências
        run: npm ci

      - name: Compila o pacote compartilhado
        run: npm run build -w @campus/shared

      - name: Gera o cliente do Prisma
        run: npm run prisma:generate -w campus-api

      # `INT_SEM_DOCKER=true` desliga a tentativa de subir o `db-teste` do
      # compose: aqui o banco é o `services:` acima. O gancho existe no
      # `globalSetup` exatamente para este caso.
      - name: Testes de integração
        run: npm run test:int -w campus-api
        env:
          INT_SEM_DOCKER: 'true'
          DATABASE_URL: postgresql://campus:campus_dev_local@localhost:5433/campus_teste?schema=public&connection_limit=60&pool_timeout=30

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    # Mesmo banco, mesma razão: o projeto `api-*` do Playwright sobe a API de
    # verdade e a percorre pela interface. Sem `services:`, este job rodava só
    # os testes do modo mock e as três verificações contra a stack real ficavam
    # sem execução em CI — verdes na máquina de alguém, o que não é verde.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campus
          POSTGRES_PASSWORD: campus_dev_local
          POSTGRES_DB: campus_teste
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Job separado do de aplicação de propósito: o E2E baixa um navegador
    # (~120 MB) e leva dezenas de segundos. Separá-lo faz lint e teste unitário
    # continuarem devolvendo resultado em menos de dois minutos, e o E2E não
    # bloqueia a leitura do que falhou antes dele.
    #
    # Este job fecha a pendência 6.1 de docs/13-roadmap-cp5-cp6.md: o E2E existia
    # escrito e configurado desde o CP4 e nunca havia sido executado. Enquanto a
    # execução dependia da máquina de alguém, nenhuma afirmação sobre ele era
    # verificável — e a primeira execução reprovou 6 de 6.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instala dependências
        run: npm ci

      # O projeto `api-*` do Playwright COMPILA a API no `webServer`, e a API
      # importa tipos gerados. Sem estes dois passos o build morre em
      # `Module '"@prisma/client"' has no exported member 'Evento'` e em dezenas
      # de `TS7006` — mensagens que não mencionam geração de cliente.
      - name: Compila o pacote compartilhado
        run: npm run build -w @campus/shared

      - name: Gera o cliente do Prisma
        run: npm run prisma:generate -w campus-api

      # Só o Chromium: os três projetos do Playwright pesariam 4× por uma
      # informação que o alvo do produto (web mobile) não precisa.
      #
      # `npm exec -w campus-app`, e não `npx`: `@playwright/test` é dependência
      # DO APP e o npm não o iça para a raiz, então `npx playwright` da raiz
      # falha com `sh: 1: playwright: not found` — que é a mesma armadilha de
      # monorepo do `jsdom` (defeito 16 em docs/17-jornada.md), com outra
      # mensagem que também não menciona workspace.
      - name: Instala o Chromium
        run: npm exec -w campus-app -- playwright install --with-deps chromium

      # O `webServer` do playwright.config.ts roda o build e serve o preview: o
      # alvo é o artefato de produção, não o dev server.
      - name: Roda o E2E
        run: npm run test:e2e
        env:
          E2E_SEM_DOCKER: 'true'
          DATABASE_URL: postgresql://campus:campus_dev_local@localhost:5433/campus_teste?schema=public
          JWT_SECRET: placeholder-de-ci-com-32-caracteres
          WEBHOOK_SECRET: placeholder-de-ci-16
          PERMITIR_SIMULACAO_PAGAMENTO: 'true'

      - name: Guarda o relatório quando falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
