name: Deploy GitHub Pages

# Publica seis coisas no mesmo site, porque as seis são entregáveis avaliados:
#   /                app React (base /campus/), instalável pelo manifest
#   /styleguide/     prova visual da identidade visual
#   /prototipo/      protótipo estático original, preservado
#   /slides/         deck de apoio do vídeo do CP4
#   /slides-cp5/     deck de apoio do vídeo do CP5
#   /slides-cp6/     deck de apoio do vídeo do CP6
#
# O app publicado aqui roda em modo MOCK, e isso é a decisão, não uma limitação
# esquecida: o Pages não tem backend. A stack com API e PostgreSQL é o
# `docker compose up` de `docs/23-instalacao.md`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez, sem cancelar o que já começou: publicação interrompida no
# meio deixaria o site em estado indeterminado.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Monta o site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          # Raiz, não `app/`: o monorepo do CP6 tem UM lockfile, na raiz. Com o
          # caminho antigo o job morria em "Some specified paths were not
          # resolved, unable to cache dependencies" — mensagem que não menciona
          # monorepo, workspace nem lockfile ausente.
          cache-dependency-path: package-lock.json

      # Na raiz e sem `working-directory`: `npm ci` dentro de `app/` num
      # workspace instala a árvore errada (ou nenhuma) porque o lockfile que ele
      # procura não existe lá.
      - name: Instala dependências
        run: npm ci

      # GITHUB_PAGES=true faz o Vite usar base '/campus/'. Sem isso, os assets
      # e o roteador quebram, porque o site não fica na raiz do domínio.
      #
      # Sem `VITE_DATA_SOURCE`: o padrão é `mock`, e é o certo aqui. O Pages
      # serve arquivo estático e não tem servidor nenhum — é o MSW no navegador
      # de quem abre que responde `/api` (ADR-0003). Construir com `api` daria
      # um site que só mostra erro de conexão.
      #
      # O build do app resolve `@campus/shared` pela FONTE, pelo alias do
      # `vite.config.ts`, então não precisa do `dist` do pacote — ao contrário
      # da API, que precisa e por isso tem um passo a mais no `ci.yml`.
      - name: Build do app
        env:
          GITHUB_PAGES: 'true'
        run: npm run build -w campus-app

      - name: Monta a árvore do site
        run: |
          mkdir -p site
          cp -r app/dist/. site/

          # Styleguide: página única e autossuficiente da marca.
          mkdir -p site/styleguide
          cp docs/06-marca/styleguide.html site/styleguide/index.html
          cp -r docs/06-marca/assets site/styleguide/assets

          # Protótipo estático original, preservado como referência visual.
          mkdir -p site/prototipo
          cp prototype/legacy/index.html site/prototipo/index.html

          # Deck de apoio da gravação do vídeo de 2 minutos.
          mkdir -p site/slides
          cp docs/15-video-slides.html site/slides/index.html

          # Deck do CP5. A cópia é condicional porque este arquivo é escrito em
          # paralelo com o deploy: se ele ainda não existir no commit, o site
          # continua publicando as outras quatro entregas em vez de o job
          # inteiro falhar em `cp: No such file or directory`.
          if [ -f docs/20-video-cp5-slides.html ]; then
            mkdir -p site/slides-cp5
            cp docs/20-video-cp5-slides.html site/slides-cp5/index.html
          else
            echo "::warning::docs/20-video-cp5-slides.html ausente — /slides-cp5/ não foi publicado"
          fi

          # Deck do CP6, pela mesma razão e com a mesma condicional.
          if [ -f docs/25-video-cp6-slides.html ]; then
            mkdir -p site/slides-cp6
            cp docs/25-video-cp6-slides.html site/slides-cp6/index.html
          else
            echo "::warning::docs/25-video-cp6-slides.html ausente — /slides-cp6/ não foi publicado"
          fi

          # O GitHub Pages serve arquivos estáticos: sem isso, o Jekyll ignora
          # diretórios que começam com underscore.
          touch site/.nojekyll

          # SPA com React Router: qualquer rota profunda precisa cair no
          # index.html. O 404.html do Pages é o jeito suportado de fazer isso.
          cp app/dist/index.html site/404.html

      # `enablement: true` faz a action CRIAR o site do Pages com
      # `build_type: workflow`, em vez de exigir que alguém acerte o dropdown
      # em Settings antes.
      #
      # Sem isso o job morre em "Get Pages site failed ... verify that the
      # repository has Pages enabled and configured to build using GitHub
      # Actions" — e a mensagem tem duas causas possíveis que ela não distingue:
      # Pages desligado, ou Pages ligado no modo ERRADO. Foi a segunda aqui: o
      # Source estava em "Deploy from a branch" (`build_type: legacy`), que é o
      # padrão de quem só clica em ativar.
      #
      # O `GITHUB_TOKEN` deste job tem `pages: write` (ver `permissions:` acima),
      # que é o suficiente para a chamada. O efeito prático é que quem clonar
      # este repositório e habilitar Actions publica o site sem passo manual —
      # que é o mesmo critério de instalabilidade aplicado à própria publicação.
      - name: Configura o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacota o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publica
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publica no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
