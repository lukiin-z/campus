            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /participacoes:
    get:
      operationId: listarMinhasParticipacoes
      summary: 'Participações do titular (RF-007)'
      tags: [participacoes]
      security:
        - bearer: []
      description: 'Exige: Qualquer titular autenticado'
