        '422':
          description: 'Regra de negócio violada; não muda por espera'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /eventos/{id}/lista-espera:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: entrarNaListaEspera
      summary: 'Entra na fila FIFO do evento lotado (RN-006)'
      tags: [participacoes]
      security:
        - bearer: []
      description: 'Exige: Qualquer titular autenticado'
