          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: 'Não existe — ou está fora do seu alcance (RN-001, RNF-012)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    patch:
      operationId: editarEvento
      summary: 'Edita evento não encerrado (RN-023)'
      tags: [eventos]
      security:
        - bearer: []
      description: 'Exige: Organizador do evento, ou admin com competência no escopo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdicaoEvento' }
      responses:
        '200':
          description: 'Edita evento não encerrado (RN-023)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '403':
          description: 'Autenticado, mas sem competência sobre o recurso'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: 'Não existe — ou está fora do seu alcance (RN-001, RNF-012)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: 'Conflito com o estado atual; pode deixar de acontecer'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: 'Regra de negócio violada; não muda por espera'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /eventos/{id}/cancelamento:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelarEvento
      summary: 'Cancela o evento e as participações em cascata (RN-021, RN-022)'
      tags: [eventos]
      security:
        - bearer: []
      description: 'Exige: Organizador do evento, ou admin com competência no escopo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelamentoEvento' }
      responses:
        '201':
          description: 'Cancela o evento e as participações em cascata (RN-021, RN-022)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '403':
          description: 'Autenticado, mas sem competência sobre o recurso'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: 'Não existe — ou está fora do seu alcance (RN-001, RNF-012)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: 'Conflito com o estado atual; pode deixar de acontecer'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: 'Regra de negócio violada; não muda por espera'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /eventos/{id}/aprovacao:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: aprovarEvento
      summary: 'Aprova evento de alcance FACULDADE (RN-003)'
      tags: [eventos]
      security:
        - bearer: []
      description: 'Exige: Admin de Faculdade da faculdade do recurso'
      responses:
        '201':
          description: 'Aprova evento de alcance FACULDADE (RN-003)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evento' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '403':
          description: 'Autenticado, mas sem competência sobre o recurso'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: 'Não existe — ou está fora do seu alcance (RN-001, RNF-012)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: 'Conflito com o estado atual; pode deixar de acontecer'
