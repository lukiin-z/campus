        '200':
          description: 'Ingresso e histórico da participação'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipacaoView' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404':
          description: 'Não existe — ou está fora do seu alcance (RN-001, RNF-012)'
