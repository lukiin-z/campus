# Contrato da API do Campus — CP6.
#
# GERADO. A fonte é a tabela de endpoints de
# `scripts/../docs/21-api-contrato.md`, e o mesmo dado alimenta a tabela
# daquele documento. Editar este YAML à mão diverge do documento na
# primeira mudança — que foi exatamente o que aconteceu entre o contrato
# escrito no CP4 e as rotas do mock do CP5 (ver 08-arquitetura.md §5.11).
#
# O `@nestjs/swagger` também serve um spec em `/api/docs`, gerado do código
# em execução. Os dois têm de concordar na lista de caminhos.
openapi: 3.1.0
info:
  title: Campus API
  version: 1.0.0
  description: |
    Eventos universitários com alcance segmentado por turma, curso e faculdade.

    Duas convenções valem em todo o contrato e explicam a maior parte das
    escolhas de código de status:

    - **`404` para invisível.** Um evento de turma acessado por quem não é da
      turma responde `404`, não `403`. Revelar a existência do evento já é
      vazamento de alcance (RN-001, RNF-012). O `403` só aparece onde a
      existência do recurso **já** é conhecida por quem pede.
    - **`409` versus `422`.** `409` é conflito com o estado atual e pode deixar
      de acontecer — a vaga pode abrir, e por isso a resposta traz `acao`.
      `422` é regra de negócio violada e não muda por espera.
  contact:
    name: Equipe Campus — FIAP, Engenharia de Software
  license:
    name: MIT
servers:
  - url: http://localhost:3000/api
    description: Desenvolvimento local (docker compose)
  - url: https://campus-api.onrender.com/api
    description: Publicado — ver docs/23-instalacao.md
tags:
  - name: saude
  - name: autenticacao
  - name: academico
  - name: eventos
  - name: participacoes
  - name: pagamentos
  - name: checkin
  - name: feed
  - name: notificacoes
  - name: admin
paths:
  /health:
    get:
      operationId: saude
      summary: 'Saúde da API e conexão com o banco'
      tags: [saude]
      security: []
      responses:
        '200':
          description: 'Saúde da API e conexão com o banco'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Saude' }
  /auth/cadastro:
    post:
      operationId: cadastrar
      summary: 'Cria conta com e-mail institucional (RF-001)'
      tags: [autenticacao]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Cadastro' }
      responses:
        '201':
          description: 'Cria conta com e-mail institucional (RF-001)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoLogin' }
        '409':
          description: 'Conflito com o estado atual; pode deixar de acontecer'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: 'Regra de negócio violada; não muda por espera'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '429':
          description: 'Limite de taxa excedido (RNF-021)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /auth/login:
    post:
      operationId: entrar
      summary: 'Autentica e devolve os tokens (RF-003, RN-002)'
      tags: [autenticacao]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credenciais' }
      responses:
        '201':
          description: 'Autentica e devolve os tokens (RF-003, RN-002)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoLogin' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: 'Regra de negócio violada; não muda por espera'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '429':
          description: 'Limite de taxa excedido (RNF-021)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /auth/refresh:
    post:
      operationId: renovar
      summary: 'Troca o refresh por um par novo (RNF-020)'
      tags: [autenticacao]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Refresh' }
      responses:
        '201':
          description: 'Troca o refresh por um par novo (RNF-020)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultadoLogin' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /auth/logout:
    post:
      operationId: sair
      summary: 'Revoga a sessão corrente'
      tags: [autenticacao]
      security:
        - bearer: []
      description: 'Exige: Qualquer titular autenticado'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Refresh' }
      responses:
        '204': { description: Sem conteúdo }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /auth/onboarding:
    post:
      operationId: concluirOnboarding
      summary: 'Vincula curso e turma pelo código de convite (RF-005, RN-003)'
      tags: [autenticacao]
      security:
        - bearer: []
      description: 'Exige: Qualquer titular autenticado'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntradaOnboarding' }
      responses:
        '201':
          description: 'Vincula curso e turma pelo código de convite (RF-005, RN-003)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoUsuario' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '409':
          description: 'Conflito com o estado atual; pode deixar de acontecer'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '422':
          description: 'Regra de negócio violada; não muda por espera'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /sessao:
