            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /participacoes/{id}/confirmar:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmarOferta
      summary: 'Confirma a vaga oferecida dentro da janela (RN-008)'
      tags: [participacoes]
