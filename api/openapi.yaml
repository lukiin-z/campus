      operationId: obterSessao
      summary: 'Titular autenticado com o vínculo resolvido'
      tags: [autenticacao]
      security:
        - bearer: []
      description: 'Exige: Qualquer titular autenticado'
      responses:
        '200':
          description: 'Titular autenticado com o vínculo resolvido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoUsuario' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /faculdade:
