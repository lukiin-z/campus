          content:
            application/json:
              schema: { $ref: '#/components/schemas/Faculdade' }
  /cursos:
    get:
      operationId: listarCursos
      summary: 'Cursos da faculdade'
      tags: [academico]
      security: []
      responses:
        '200':
          description: 'Cursos da faculdade'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaCursos' }
  /cursos/{id}/turmas:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listarTurmas
      summary: 'Turmas de um curso'
      tags: [academico]
      security: []
      responses:
        '200':
          description: 'Turmas de um curso'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaTurmas' }
        '404':
          description: 'Não existe — ou está fora do seu alcance (RN-001, RNF-012)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /eventos:
    get:
      operationId: listarEventos
      summary: 'Eventos visíveis para o titular, filtrados e ordenados (RF-015, RN-001)'
      tags: [eventos]
      security:
        - bearer: []
      description: 'Exige: Qualquer titular autenticado'
      parameters:
        - name: alcance
          in: query
          schema: { type: string, enum: [TODOS, MINHA_TURMA, MEU_CURSO, FACULDADE] }
        - name: preco
          in: query
          schema: { type: string, enum: [TODOS, GRATUITOS, PAGOS] }
        - name: periodo
          in: query
          schema: { type: string, enum: [TODOS, ESTE_MES, PROXIMOS_7_DIAS] }
        - name: busca
          in: query
          schema: { type: string, maxLength: 120 }
      responses:
        '200':
          description: 'Eventos visíveis para o titular, filtrados e ordenados (RF-015, RN-001)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaEventos' }
        '401':
          description: 'Token ausente, expirado ou inválido'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    post:
      operationId: criarEvento
      summary: 'Cria evento; alcance FACULDADE nasce em aprovação (RN-003)'
      tags: [eventos]
      security:
        - bearer: []
      description: 'Exige: Qualquer titular autenticado'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoEvento' }
      responses:
        '201':
