components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT de acesso, validade de 15 minutos. O refresh vai no corpo de
        `/auth/refresh`, é revogável e tem hash guardado na tabela `sessao` —
        um vazamento do banco não dá sessão a ninguém (RNF-020).
    assinaturaGateway:
      type: apiKey
      in: header
      name: X-Assinatura
      description: |
        HMAC-SHA256 do corpo cru com o segredo do gateway. O gateway não tem
        sessão de usuário, então `bearer` não se aplica — e o segredo fica no
        servidor, nunca no cliente.
  schemas:
    Erro:
      type: object
      required: [erro, mensagem]
      properties:
        erro:
          type: string
          description: |
            Código estável, em SCREAMING_SNAKE_CASE. É por ele que o cliente
            decide a mensagem e a tela — nunca pelo texto de `mensagem`, que é
            escrito para leitura humana e pode mudar.
          examples: [SEM_VAGA, JA_INSCRITO, PRAZO_ENCERRADO, FORA_DO_ALCANCE]
        mensagem:
          type: string
          description: Texto pronto para a tela, no tom de voz da marca.
        acao:
          type: string
          description: |
            Presente em alguns `409`: o que o cliente pode oferecer em seguida.
            `SEM_VAGA` traz `LISTA_ESPERA`.
          examples: [LISTA_ESPERA]
        totalFila:
          type: integer
          description: |
            Acompanha o `409 SEM_VAGA`. A tela convida para a fila dizendo em que
            posição a pessoa entraria — "você seria o 8º" decide mais que
            "evento lotado". Sem este campo o convite fica sem informação.
        detalhes:
          type: array
          description: Erros por campo, quando a recusa é de validação (`422`).
          items:
            type: object
            properties:
              campo: { type: string }
              mensagem: { type: string }

    Saude:
      type: object
      required: [status, banco]
      properties:
        status: { type: string, enum: [ok, degradado] }
        banco: { type: string, enum: [ok, indisponivel] }
        versao: { type: string }
        migrationsAplicadas: { type: integer }

    Credenciais:
      type: object
      required: [email, senha]
      properties:
        email: { type: string, format: email }
        senha: { type: string, minLength: 8 }
    Cadastro:
      allOf:
        - $ref: '#/components/schemas/Credenciais'
        - type: object
          required: [nome]
          properties:
            nome: { type: string, minLength: 3, maxLength: 120 }
    Refresh:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    ResultadoLogin:
      type: object
      required: [accessToken, refreshToken, sessao]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiraEm: { type: integer, description: Segundos de validade do access token }
        sessao: { $ref: '#/components/schemas/SessaoUsuario' }
    EntradaOnboarding:
      type: object
      required: [cursoId, codigoConvite]
      properties:
        cursoId: { type: string, format: uuid }
        codigoConvite: { type: string, maxLength: 24 }

    Faculdade:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        sigla: { type: string }
        dominiosEmail: { type: array, items: { type: string } }
    Curso:
      type: object
      properties:
        id: { type: string, format: uuid }
        faculdadeId: { type: string, format: uuid }
        nome: { type: string }
        codigo: { type: string }
        duracaoSemestres: { type: integer }
    Turma:
      type: object
      description: |
        `codigoConvite` é **opcional na resposta, e isso é decisão de segurança**:
        ele é credencial, não identificador — quem tem o código entra na turma e
        passa a ver os eventos dela (RN-003).

        `GET /cursos/{id}/turmas` é público e **omite** o campo.
        `POST /admin/turmas/{id}/codigo` o devolve, para quem tem competência no
        escopo. A API implementou essa distinção acima do que a primeira versão
        deste contrato pedia.
      required: [id, cursoId, nome, periodo, codigoAtivo]
      properties:
        id: { type: string, format: uuid }
        cursoId: { type: string, format: uuid }
        nome: { type: string }
        periodo: { type: string }
        codigoConvite: { type: string }
        codigoAtivo: { type: boolean }
    ListaCursos:
      type: array
      items: { $ref: '#/components/schemas/Curso' }
    ListaTurmas:
      type: array
      items: { $ref: '#/components/schemas/Turma' }

    Usuario:
      type: object
      description: |
        `senhaHash` NÃO aparece em nenhuma projeção de leitura. O campo existe no
        banco e é lido em um lugar só — a verificação de credencial.

        `cursoId` e `turmaId` são **obrigatórios e anuláveis**, não opcionais, e a
        distinção tem consequência observável: `onboardingPendente` decide o
        destino pós-login com `cursoId === null || turmaId === null`. Se a API
        omitir os campos, `undefined === null` é falso, e o aluno sem vínculo cai
        no feed — que para ele é vazio e sem explicação (RF-004). A primeira
        versão deste schema os omitia.
      required:
        [
          id,
          nome,
          email,
          avatarSeed,
          faculdadeId,
          cursoId,
          turmaId,
          papeis,
          emailVerificado,
          visivelEntreConfirmados,
        ]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        avatarSeed: { type: integer }
        faculdadeId: { type: string, format: uuid }
        cursoId: { type: [string, 'null'], format: uuid }
        turmaId: { type: [string, 'null'], format: uuid }
        papeis:
          type: array
          items: { type: string, enum: [ALUNO, ADMIN_CURSO, ADMIN_FACULDADE] }
        emailVerificado: { type: boolean }
        visivelEntreConfirmados: { type: boolean }
        criadoEm: { type: string, format: date-time }
    AutorResumido:
      type: object
      description: |
        O autor aninhado em evento, publicação, comentário e presença — e é
        **deliberadamente menor** que `Usuario`.

        `Usuario` exige `email`, e a lista de eventos e o feed são vistos por
        toda a turma, o curso ou a faculdade. Aninhar o usuário completo
        exporia o e-mail institucional de cada organizador e de cada pessoa que
        comentou, a cada carregamento de tela, para quem não tem nada a ver com
        isso (RNF-021).

        Três campos bastam para o que a interface mostra: o nome e o avatar de
        iniciais, mais o id para navegar. A primeira versão deste contrato
        declarava `$ref: Usuario` aqui, e foi a implementação da API que apontou
        — ela devolvia os três campos e recusou-se a devolver o resto.
      required: [id, nome, avatarSeed]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        avatarSeed: { type: integer }

    SessaoUsuario:
      type: object
      description: Titular com o vínculo acadêmico já resolvido — uma chamada, não quatro.
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        faculdade: { $ref: '#/components/schemas/Faculdade' }
        curso:
          oneOf:
            - $ref: '#/components/schemas/Curso'
            - type: 'null'
        turma:
          oneOf:
            - $ref: '#/components/schemas/Turma'
            - type: 'null'

    NovoEvento:
      type: object
      required: [titulo, descricao, alcance, inicio, fim, local, capacidade, preco, publicar]
      description: |
        Não existe campo de âncora (`turmaId`/`cursoId`/`faculdadeId`): ela vem do
        vínculo de quem cria (RN-001). Aceitá-la do cliente permitiria publicar
        na turma de outra pessoa.
      properties:
        titulo: { type: string, minLength: 4, maxLength: 120 }
        descricao: { type: string, minLength: 20, maxLength: 2000 }
        alcance: { type: string, enum: [TURMA, CURSO, FACULDADE] }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        local: { type: string, minLength: 3, maxLength: 160 }
        capacidade: { type: integer, minimum: 2, maximum: 2000 }
        preco: { type: number, minimum: 0, maximum: 5000 }
        prazoInscricao: { type: string, format: date-time }
        prazoCancelamento: { type: string, format: date-time }
        publicar: { type: boolean }
        perguntas:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/PerguntaCustomizada' }
    EdicaoEvento:
      type: object
      description: |
        Subconjunto editável. `alcance` e `capacidade` para baixo não entram:
        reduzir capacidade abaixo de `ocupadas` deixaria inscrito sem vaga, e
        mudar alcance tiraria a visibilidade de quem já se inscreveu.
      properties:
        titulo: { type: string }
        descricao: { type: string }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        local: { type: string }
        capacidade: { type: integer }
        prazoInscricao: { type: string, format: date-time }
        prazoCancelamento: { type: string, format: date-time }
    CancelamentoEvento:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 10, maxLength: 400 }
    PerguntaCustomizada:
      type: object
      required: [enunciado, tipo, obrigatoria]
      properties:
        enunciado: { type: string, maxLength: 160 }
        tipo: { type: string, enum: [TEXTO_CURTO, ESCOLHA_UNICA] }
        opcoes: { type: array, items: { type: string }, minItems: 2, maxItems: 6 }
        obrigatoria: { type: boolean }
    Evento:
      type: object
      description: Projeção de leitura — traz o que a lista e o detalhe mostram em uma requisição.
      properties:
        id: { type: string, format: uuid }
        organizadorId: { type: string, format: uuid }
        titulo: { type: string }
        descricao: { type: string }
        alcance: { type: string, enum: [TURMA, CURSO, FACULDADE] }
        alcanceRotulo: { type: string, examples: ['3ESPX'] }
        turmaId: { type: [string, 'null'], format: uuid }
        cursoId: { type: [string, 'null'], format: uuid }
        faculdadeId: { type: [string, 'null'], format: uuid }
        inicio: { type: string, format: date-time }
        fim: { type: string, format: date-time }
        local: { type: string }
        capacidade: { type: integer }
        ocupadas: { type: integer }
        vagasDisponiveis: { type: integer }
        taxaOcupacao: { type: number }
        inscricoesAbertas: { type: boolean }
        totalListaEspera: { type: integer }
        preco: { type: number }
        status: { type: string, enum: [RASCUNHO, EM_APROVACAO, PUBLICADO, CANCELADO, REALIZADO] }
        motivoCancelamento: { type: [string, 'null'] }
        prazoInscricao: { type: string, format: date-time }
        prazoCancelamento: { type: string, format: date-time }
        capaSeed: { type: integer }
        organizador: { $ref: '#/components/schemas/AutorResumido' }
        minhaParticipacao:
          oneOf:
            - $ref: '#/components/schemas/Participacao'
            - type: 'null'
    ListaEventos:
      type: array
      items: { $ref: '#/components/schemas/Evento' }
    ListaEventosResumidos:
      type: array
      items:
        type: object
        properties:
          id: { type: string, format: uuid }
          titulo: { type: string }

    Participacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventoId: { type: string, format: uuid }
        usuarioId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusParticipacao' }
        posicaoFila: { type: [integer, 'null'], minimum: 1 }
        pagamentoExpiraEm: { type: [string, 'null'], format: date-time }
        ofertaExpiraEm: { type: [string, 'null'], format: date-time }
        motivoCancelamento:
          type: [string, 'null']
          enum:
            [
              ALUNO_DESISTIU,
              EVENTO_CANCELADO,
              VINCULO_PERDIDO,
              REMOVIDO_PELO_ORGANIZADOR,
              OFERTA_RECUSADA,
              null,
            ]
        canceladaAposPrazo: { type: boolean }
        politicaVigente:
          type: [object, 'null']
          description: Política de reembolso congelada no pagamento (RN-013).
        criadoEm: { type: string, format: date-time }
    ParticipacaoView:
      allOf:
        - $ref: '#/components/schemas/Participacao'
        - type: object
          description: |
            Projeção de leitura: a participação com o evento, o pagamento e a
            presença **já resolvidos**.

            É o que a tela "Minhas inscrições" consome — ela mostra título,
            preço e estado do pagamento. A primeira versão do contrato devolvia
            a entidade nua aqui, o que deixaria a tela com duas saídas ruins:
            N+1 requisições, ou campo em branco.
          required: [evento, pagamento, presenca]
          properties:
            evento: { $ref: '#/components/schemas/Evento' }
            pagamento:
              oneOf:
                - $ref: '#/components/schemas/Pagamento'
                - type: 'null'
            presenca:
              type: [object, 'null']
              properties:
                id: { type: string, format: uuid }
                metodo: { type: string, enum: [QR_CODE, CODIGO_NUMERICO, MANUAL] }
                checkinEm: { type: string, format: date-time }
                motivoCorrecao: { type: [string, 'null'] }
    ListaParticipacoes:
      type: array
      items: { $ref: '#/components/schemas/ParticipacaoView' }
    StatusParticipacao:
      # Espelha `STATUS_PARTICIPACAO` de packages/shared/src/types.ts. Existe
      # como schema nomeado porque o mesmo enum era repetido em dois lugares
      # do contrato e omitido num terceiro.
      type: string
      enum:
        [
          PENDENTE_PAGAMENTO,
          CONFIRMADA,
          LISTA_ESPERA,
          OFERTA_PENDENTE,
          PRESENTE,
          AUSENTE,
          CANCELADA,
          EXPIRADA,
        ]
    ListaParticipantes:
      type: array
      description: |
        Respeita o opt-out de RF-009: quem marcou `visivelEntreConfirmados` como
        falso não aparece, nem para o organizador.
      items:
        type: object
        required: [participacaoId, nome, turma, status]
        properties:
          participacaoId: { type: string, format: uuid }
          nome: { type: string }
          turma: { type: [string, 'null'] }
          # Era `type: string` solto — a mais frouxa das três declarações que
          # este campo tinha (app, API e contrato). Um cliente escrito contra o
          # contrato teria de aceitar qualquer texto onde a consulta só emite
          # `CONFIRMADA` e `PRESENTE`.
          status: { $ref: '#/components/schemas/StatusParticipacao' }
    ResultadoCancelamento:
      type: object
      properties:
        cancelada: { type: boolean }
        promovido:
          type: [string, 'null']
          description: Id de quem recebeu a oferta da vaga liberada (RN-007).
        reembolso:
          type: [object, 'null']
          description: Faixa aplicada e valor, quando havia pagamento (RN-013).

    NovoPagamento:
      type: object
      required: [metodo]
      description: |
        Não existe campo para número de cartão, validade ou CVV — nem opcional.
        RNF-022 se cumpre pelo FORMATO do contrato: um cliente que tentasse
        enviar o número recebe `422`, porque o objeto de cartão é estrito.
      properties:
        metodo: { type: string, enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO] }
        cartao: { $ref: '#/components/schemas/ResumoCartao' }
    ResumoCartao:
      type: object
      additionalProperties: false
      required: [ultimosQuatro, bandeira, titular]
      properties:
        ultimosQuatro: { type: string, pattern: '^[0-9]{4}$' }
        bandeira: { type: string }
        titular: { type: string }
    Pagamento:
      type: object
      properties:
        id: { type: string, format: uuid }
        participacaoId: { type: string, format: uuid }
        metodo: { type: string, enum: [PIX, CARTAO_CREDITO, CARTAO_DEBITO] }
        valor: { type: number }
        valorReembolsado: { type: number }
        status:
          type: string
          enum:
            [
              AGUARDANDO,
              CONFIRMADO,
              RECUSADO,
              EM_ANALISE,
              REEMBOLSO_SOLICITADO,
              REEMBOLSADO,
              REEMBOLSADO_PARCIAL,
              ESTORNADO,
            ]
        minutosRestantes: { type: [integer, 'null'] }
        chaveIdempotencia:
          type: string
          description: |
            Não é segredo: é derivada de `(participacaoId, transacaoExternaId)` e
            existe para o gateway não processar a mesma notificação duas vezes
            (RN-014). A tela de demonstração do gateway a exibe justamente para
            tornar a idempotência visível — ela é invisível quando tudo dá certo
            na primeira tentativa.
        transacaoExternaId: { type: [string, 'null'] }
        pix:
          type: [object, 'null']
          properties:
            chave: { type: string }
            brCode: { type: string, description: Payload EMV com CRC16 }
            expiraEm: { type: string, format: date-time }
        cartao:
          oneOf:
            - $ref: '#/components/schemas/ResumoCartao'
            - type: 'null'
        criadoEm: { type: string, format: date-time }
        confirmadoEm: { type: [string, 'null'], format: date-time }
    WebhookPagamento:
      type: object
      required: [transacaoExternaId, chaveIdempotencia, valorPago, pago]
      properties:
        transacaoExternaId: { type: string }
        chaveIdempotencia: { type: string }
        valorPago: { type: number }
        pago: { type: boolean }
    AceitePagamento:
      type: object
      description: |
        Sempre `200`, inclusive no reprocessamento. Responder erro faria o
        gateway reenviar indefinidamente: idempotência é resposta de sucesso sem
        efeito, não recusa (RN-014).
      properties:
        desfecho:
          type: string
          enum: [CONFIRMAR, IGNORAR_DUPLICADA, ESTORNAR, DIVERGENCIA_DE_VALOR, DESCONHECIDO]
    DesfechoSimulado:
      type: object
      required: [desfecho]
      properties:
        desfecho: { type: string, enum: [CONFIRMAR, RECUSAR, DUPLICAR] }

    TokenIngresso:
      type: object
      properties:
        valor: { type: string, description: 'Conteúdo do QR: campus.v1.<payload>.<assinatura>' }
        codigoNumerico: { type: string, pattern: '^[0-9]{8}$' }
        codigoLegivel: { type: string, examples: ['CMP-3ESPX-0184'] }
        emitidoEm: { type: string, format: date-time }
        expiraEm: { type: string, format: date-time }
    LeituraCheckin:
      type: object
      required: [leitura]
      description: |
        A leitura vai crua; quem classifica é o servidor. As três formas — token,
        código de 8 dígitos e código impresso — convergem para a MESMA decisão.
      properties:
        leitura: { type: string, minLength: 1, maxLength: 4096 }
    PresencaManual:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 10, maxLength: 400 }
    ResultadoCheckin:
      type: object
      description: |
        Recusa vem com `200` e `aceito: false`. Na porta de um evento com fila,
        "ingresso já usado" é resposta do sistema, não falha dele — e um `4xx`
        mandaria a tela mostrar "erro ao validar".
      properties:
        aceito: { type: boolean }
        motivo:
          type: [string, 'null']
          enum:
            [
              TOKEN_INVALIDO,
              OUTRO_EVENTO,
              AINDA_NAO_ABRIU,
              JA_ENCERROU,
              JA_UTILIZADO,
              NAO_CONFIRMADA,
              SEM_PERMISSAO,
              EVENTO_CANCELADO,
              null,
            ]
        mensagem: { type: string }
        participante:
          type: [object, 'null']
          properties:
            nome: { type: string }
            turma: { type: [string, 'null'] }
        registradoEm: { type: [string, 'null'], format: date-time }
    PainelCheckin:
      type: object
      properties:
        evento: { $ref: '#/components/schemas/Evento' }
        abertoAgora: { type: boolean }
        abreEm: { type: string, format: date-time }
        fechaEm: { type: string, format: date-time }
        confirmados: { type: integer }
        presentes: { type: integer }
        aguardando:
          type: array
          items:
            type: object
            properties:
              participacaoId: { type: string, format: uuid }
              nome: { type: string }
              turma: { type: [string, 'null'] }
              codigoNumerico: { type: string }
        presencas:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              participacaoId: { type: string, format: uuid }
              metodo: { type: string, enum: [QR_CODE, CODIGO_NUMERICO, MANUAL] }
              checkinEm: { type: string, format: date-time }
              participante: { $ref: '#/components/schemas/AutorResumido' }

    NovaPublicacao:
      type: object
      required: [eventoId, legenda]
      properties:
        eventoId: { type: string, format: uuid }
        legenda: { type: string, minLength: 2, maxLength: 500 }
        imagemSeed: { type: integer, minimum: 1, maximum: 24 }
    NovoComentario:
      type: object
      required: [texto]
      properties:
        texto: { type: string, minLength: 2, maxLength: 280 }
    RemocaoPublicacao:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 10, maxLength: 400 }
    Comentario:
      type: object
      description: |
        `autor` vem resolvido. O cartão de publicação mostra nome e avatar de quem
        comentou; sem o objeto, o feed renderizaria `undefined` para cada
        comentário — e a tela não pode buscar usuário por conta própria.
      required: [id, publicacaoId, autorId, texto, removido, criadoEm, autor]
      properties:
        id: { type: string, format: uuid }
        publicacaoId: { type: string, format: uuid }
        autorId: { type: string, format: uuid }
        texto: { type: string }
        removido: { type: boolean }
        criadoEm: { type: string, format: date-time }
        autor: { $ref: '#/components/schemas/AutorResumido' }
    Publicacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        eventoId: { type: string, format: uuid }
        autorId: { type: string, format: uuid }
        legenda: { type: string }
        imagemSeed: { type: integer }
        removida: { type: boolean }
        motivoRemocao: { type: [string, 'null'] }
        criadoEm: { type: string, format: date-time }
        autor: { $ref: '#/components/schemas/AutorResumido' }
        evento: { $ref: '#/components/schemas/Evento' }
        comentarios:
          type: array
          items: { $ref: '#/components/schemas/Comentario' }
    ListaPublicacoes:
      type: array
      items: { $ref: '#/components/schemas/Publicacao' }

    Notificacao:
      type: object
      properties:
        id: { type: string, format: uuid }
        destinatarioId: { type: string, format: uuid }
        tipo:
          type: string
          enum:
            [
              NOVO_EVENTO,
              VAGA_LIBERADA,
              PAGAMENTO_CONFIRMADO,
              PAGAMENTO_EXPIRADO,
              EVENTO_ALTERADO,
              EVENTO_CANCELADO,
              CHECKIN_REALIZADO,
              EVENTO_APROVADO,
            ]
        titulo: { type: string }
        mensagem: { type: string }
        referenciaId:
          type: [string, 'null']
          description: |
            Sem FK de propósito: aponta para tabelas diferentes por tipo. O
            consumidor trata "não encontrado" como caminho normal.
        lida: { type: boolean }
        criadoEm: { type: string, format: date-time }
    ListaNotificacoes:
      type: array
      items: { $ref: '#/components/schemas/Notificacao' }
